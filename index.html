<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="5e83e9b7fbf32b6e74112c20ab0191f5">
  <title>DicsyMods — Best Modified Apps & Games Download Portal</title>
  <meta name="description" content="Download secure, tested APK mods, premium streaming apps, and unlocked android games for free on DicsyMods.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07090f;
      --glass-surface: rgba(255, 255, 255, 0.045);
      --glass-hover: rgba(255, 255, 255, 0.085);
      --glass-border: rgba(255, 255, 255, 0.12);
      --cyan: #00e5ff;
      --blue: #2979ff;
      --telegram: #229ED9;
      --purple: #8b5cf6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 229, 255, 0.12) 0%, transparent 35%),
        radial-gradient(circle at 85% 25%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    .glass {
      background: var(--glass-surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      border-radius: 18px;
    }
    header {
      position: sticky;
      top: 10px;
      z-index: 200;
      max-width: 1180px;
      margin: 10px auto 0;
      padding: 0 14px;
    }
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      height: 58px;
      position: relative;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #000;
    }
    .brand-title {
      font-size: 1.22rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }
    .icon-btn.tg-btn { background: linear-gradient(135deg, #229ED9, #1b7db0); }
    .dropdown-menu {
      position: absolute;
      top: 66px;
      right: 14px;
      width: 235px;
      background: rgba(12, 16, 28, 0.96);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 14px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 300;
    }
    .dropdown-menu.show { display: flex; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      background: transparent;
      border: none;
      width: 100%;
      cursor: pointer;
      text-align: left;
    }
    .menu-item:hover { background: rgba(0, 229, 255, 0.12); color: var(--cyan); }
    .container { max-width: 1180px; margin: 22px auto; padding: 0 14px; }
    .hero { text-align: center; padding: 30px 18px; margin-bottom: 20px; }
    .hero h1 { font-size: clamp(1.55rem, 4vw, 2.35rem); font-weight: 800; margin-bottom: 8px; }
    .hero p { color: var(--text-secondary); max-width: 540px; margin: 0 auto 20px; font-size: 0.9rem; }
    .search-wrap { max-width: 520px; margin: 0 auto 16px; position: relative; }
    .search-input {
      width: 100%;
      padding: 14px 18px 14px 44px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.38);
      color: #fff;
      font-size: 0.93rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--cyan); }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
    .categories { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .cat-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      padding: 7px 15px;
      border-radius: 22px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cat-btn.active, .cat-btn:hover { background: rgba(0, 229, 255, 0.2); color: #fff; border-color: var(--cyan); }
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 18px; }
    .app-card { padding: 18px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .app-card:hover { transform: translateY(-4px); border-color: var(--cyan); }
    .card-top { display: flex; align-items: center; gap: 13px; margin-bottom: 12px; }
    .app-icon { width: 58px; height: 58px; border-radius: 14px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--cyan); font-size: 1.2rem; }
    .app-meta h3 { font-size: 1.02rem; font-weight: 700; margin-bottom: 4px; color: #fff; }
    .version-tag { font-size: 0.73rem; color: var(--cyan); background: rgba(0, 229, 255, 0.1); padding: 2px 7px; border-radius: 6px; }
    .app-desc { font-size: 0.84rem; color: var(--text-secondary); line-height: 1.45; margin-bottom: 16px; }
    .btn-card { width: 100%; padding: 10px; border-radius: 10px; background: rgba(0, 229, 255, 0.18); border: 1px solid rgba(0, 229, 255, 0.4); color: #fff; font-weight: 600; text-align: center; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-box { max-width: 580px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px; position: relative; }
    .close-modal { position: sticky; top: 0; float: right; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; padding: 5px 11px; border-radius: 8px; cursor: pointer; }
    .btn-download { background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #000; font-weight: 800; font-size: 0.94rem; padding: 13px 24px; border-radius: 12px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; }
  </style>
</head>
<body>
  <header>
    <nav class="glass nav-bar">
      <a href="index.html" class="brand">
        <div class="brand-logo">D</div>
        <span class="brand-title">DicsyMods</span>
      </a>
      <div class="nav-actions">
        <button class="icon-btn" onclick="document.getElementById('dropdownMenu').classList.toggle('show')">⋮</button>
      </div>
      <div id="dropdownMenu" class="dropdown-menu">
        <a href="https://t.me/your_telegram_channel" target="_blank" class="menu-item">📢 Join Telegram</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="glass hero">
      <h1>Next-Gen Apps & Mods Portal</h1>
      <p>Select any package below to view details and high-speed download mirrors.</p>
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search apps or games..." oninput="filterApps()">
      </div>
      <div class="categories">
        <button class="cat-btn active" onclick="setCategory('All', this)">All</button>
        <button class="cat-btn" onclick="setCategory('Games', this)">Games</button>
        <button class="cat-btn" onclick="setCategory('Streaming', this)">Streaming</button>
        <button class="cat-btn" onclick="setCategory('Utilities', this)">Utilities</button>
      </div>
    </section>
    <section id="appGrid" class="app-grid">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">Loading apps database...</div>
    </section>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="glass modal-box" id="modalContent"></div>
  </div>

  <script>
    let APPS = [];
    let activeCategory = 'All';

    async function loadApps() {
      try {
        const res = await fetch('apps.json');
        if (!res.ok) throw new Error('Failed to load apps');
        APPS = await res.json();
        renderGrid(APPS);
      } catch (err) {
        document.getElementById('appGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 30px;">Error loading apps. Please check apps.json format.</div>';
      }
    }

    function renderGrid(list) {
      if (list.length === 0) {
        document.getElementById('appGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 30px;">No apps found matching your query.</div>';
        return;
      }
      document.getElementById('appGrid').innerHTML = list.map(app => `
        <div class="glass app-card" onclick="openAppModal('${app.id}')">
          <div>
            <div class="card-top">
              <div class="app-icon">${app.name[0]}</div>
              <div class="app-meta">
                <h3>${app.name}</h3>
                <span class="version-tag">${app.version}</span>
              </div>
            </div>
            <p class="app-desc">${app.desc}</p>
          </div>
          <div class="btn-card">View & Download &rarr;</div>
        </div>
      `).join('');
    }

    function setCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterApps();
    }

    function filterApps() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = APPS.filter(app => {
        const matchesCat = activeCategory === 'All' || app.category === activeCategory;
        const matchesQuery = app.name.toLowerCase().includes(q) || app.desc.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });
      renderGrid(filtered);
    }

    function openAppModal(id) {
      const app = APPS.find(a => a.id === id);
      if (!app) return;
      document.getElementById('modalContent').innerHTML = `
        <button class="close-modal" onclick="closeModal()">✕</button>
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
          <div class="app-icon" style="width:64px;height:64px;font-size:1.5rem;">${app.name[0]}</div>
          <div>
            <h2 style="font-size:1.3rem; margin-bottom:4px; color:#fff;">${app.name}</h2>
            <span class="version-tag">${app.version}</span> &nbsp; <span class="version-tag" style="background:rgba(16,185,129,0.15); color:#10b981; border-color:rgba(16,185,129,0.3)">✓ Verified</span>
          </div>
        </div>
        <p style="color:var(--text-secondary); line-height:1.6; font-size:0.9rem; margin-bottom:16px;">${app.desc}</p>
        <a href="${app.url}" target="_blank" rel="noopener" class="btn-download">
          ⬇ Download APK (MediaFire Mirror)
        </a>
        <p style="font-size:0.75rem; color:var(--text-secondary); text-align:center; margin-top:12px;">All downloads are performed strictly at the user's own risk.</p>
      `;
      document.getElementById('detailModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('open');
    }

    loadApps();
  </script>

  <!-- Monetag Vignette Banner -->

</body>
</html>
