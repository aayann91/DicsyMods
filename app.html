<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Download Package — DicsyMods</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07090f;
      --glass-surface: rgba(255, 255, 255, 0.045);
      --glass-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --cyan: #00e5ff;
      --blue: #2979ff;
      --purple: #8b5cf6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --success: #10b981;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 20% 10%, rgba(0, 229, 255, 0.14) 0%, transparent 38%),
        radial-gradient(circle at 80% 35%, rgba(139, 92, 246, 0.12) 0%, transparent 42%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glass {
      background: var(--glass-surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
      border-radius: 18px;
    }

    /* Compact Mobile Header */
    header {
      position: sticky;
      top: 10px;
      z-index: 200;
      max-width: 980px;
      margin: 10px auto 0;
      padding: 0 14px;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      height: 58px;
      flex-wrap: nowrap;
      position: relative;
    }

    .back-btn {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      white-space: nowrap;
    }

    .back-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }

    .icon-btn.tg-btn {
      background: linear-gradient(135deg, #229ED9, #1b7db0);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 3px 12px rgba(34, 158, 217, 0.35);
    }

    .dropdown-menu {
      position: absolute;
      top: 66px;
      right: 14px;
      width: 235px;
      background: rgba(12, 16, 28, 0.96);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 14px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7);
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 300;
    }

    .dropdown-menu.show { display: flex; }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .menu-item:hover {
      background: rgba(0, 229, 255, 0.12);
      color: var(--cyan);
    }

    .container {
      max-width: 980px;
      margin: 22px auto;
      padding: 0 14px;
    }

    .detail-card {
      padding: 24px;
      margin-bottom: 24px;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--glass-border);
    }

    .detail-icon {
      width: 82px;
      height: 82px;
      border-radius: 20px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .title-area h1 {
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .badges-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.76rem;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 600;
      background: rgba(0, 229, 255, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.25);
    }

    .badge-clean {
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .info-section h3 {
      font-size: 1.05rem;
      margin-bottom: 8px;
      color: var(--cyan);
    }

    .info-section p {
      color: var(--text-secondary);
      line-height: 1.6;
      font-size: 0.92rem;
      margin-bottom: 16px;
    }

    .feature-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .feature-list li {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #e2e8f0;
    }

    /* Native Static Adsterra 300x250 Slot */
    .ad-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      padding: 12px;
      max-width: 336px;
      min-height: 278px;
    }

    .ad-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .download-zone {
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 16px;
      padding: 20px;
      margin-top: 14px;
    }

    .dl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-download {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #000;
      font-weight: 800;
      font-size: 0.94rem;
      padding: 13px 24px;
      border-radius: 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
      transition: transform 0.2s;
    }

    .btn-download:hover { transform: translateY(-2px); }

    .companion-box {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px dashed rgba(255, 255, 255, 0.18);
    }

    .toggle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle-header h4 {
      color: var(--warning);
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .toggle-header p {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--glass-border);
      transition: 0.3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--cyan); }
    input:checked + .slider:before { transform: translateX(22px); background-color: #000; }

    .companion-drawer {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.35s ease;
    }

    .companion-drawer.open {
      max-height: 200px;
      opacity: 1;
      margin-top: 14px;
    }

    .companion-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(0, 229, 255, 0.07);
      border: 1px solid rgba(0, 229, 255, 0.35);
    }

    .risk-note {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .more-section h2 {
      font-size: 1.25rem;
      margin: 30px 0 14px;
    }

    .more-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .mini-card {
      padding: 14px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .mini-card:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
    }

    .mini-icon {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .mini-meta h4 {
      font-size: 0.92rem;
      color: #fff;
      margin-bottom: 2px;
    }

    .mini-meta span {
      font-size: 0.74rem;
      color: var(--cyan);
    }

    footer {
      margin-top: 44px;
      padding: 24px 16px;
      text-align: center;
      border-top: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <nav class="glass nav-bar">

  <main class="container">
    <div class="glass detail-card">
      <!-- App Info Section (Populated from apps.json) -->
      <div id="appHeaderAndInfo"></div>

      <!-- Static Native Adsterra 300x250 Banner (Guaranteed Render) -->
      <div class="glass ad-slot">

  <script>
    function toggleMenu(e) {
      e.stopPropagation();
      document.getElementById('dropdownMenu').classList.toggle('show');
    }
    document.addEventListener('click', () => {
      document.getElementById('dropdownMenu').classList.remove('show');
    });

    function toggleDrawer() {
      const toggle = document.getElementById('compToggle');
      const drawer = document.getElementById('compDrawer');
      if (toggle && drawer) {
        drawer.classList.toggle('open', toggle.checked);
      }
    }

    const params = new URLSearchParams(window.location.search);
    const currentId = params.get('id') || 'youtube';

    fetch('apps.json', { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        if (data.telegramUrl) {
          document.getElementById('topTgBtn').href = data.telegramUrl;
          document.getElementById('menuTgLink').href = data.telegramUrl;
          document.getElementById('menuReqLink').href = data.telegramUrl;
        }

        const APPS = Array.isArray(data) ? data : (data.apps || []);
        const currentApp = APPS.find(a => a.id === currentId) || APPS[0];

        document.title = `${currentApp.name} (${currentApp.version}) — DicsyMods`;

        document.getElementById('appHeaderAndInfo').innerHTML = `
          <div class="app-header">
            <img id="main-icon" class="detail-icon" src="https://www.google.com/s2/favicons?sz=128&domain=${currentApp.domain}" alt="${currentApp.name}">
            <div class="title-area">
              <h1>${currentApp.name}</h1>
              <div class="badges-row">
                <span class="badge">${currentApp.version}</span>
                <span class="badge">${currentApp.category}</span>
                <span class="badge badge-clean">✓ MediaFire Verified</span>
              </div>
            </div>
          </div>

          <div class="info-section">
            <h3>Package Overview</h3>
            <p>${currentApp.desc}</p>
            ${currentApp.features ? `
              <h3>Key Package Highlights</h3>
              <ul class="feature-list">
                ${currentApp.features.map(f => `<li>⚡ ${f}</li>`).join('')}
              </ul>
            ` : ''}
          </div>
        `;

        document.getElementById('appDownloadZone').innerHTML = `
          <div class="download-zone">
            <div class="dl-row">
              <div>
                <h3 style="font-size:1.05rem; margin-bottom:4px;">Direct MediaFire Download</h3>
                <p style="font-size:0.82rem; color:var(--text-secondary);">Package: ${currentApp.name} (${currentApp.version})</p>
              </div>
              <a href="${currentApp.url}" target="_blank" rel="noopener" class="btn-download">
                ⬇ Download APK
              </a>
            </div>

            ${currentApp.companion ? `
              <div class="companion-box">
                <div class="toggle-header">
                  <div>
                    <h4>⚡ ${currentApp.companion.title}</h4>
                    <p>${currentApp.companion.subtitle}</p>
                  </div>
                  <label class="switch">
                    <input type="checkbox" id="compToggle" checked onchange="toggleDrawer()">
                    <span class="slider"></span>
                  </label>
                </div>
                <div id="compDrawer" class="companion-drawer open">
                  <div class="companion-card">
                    <div>
                      <strong style="color:#fff; font-size:0.92rem;">${currentApp.companion.name}</strong>
                      <p style="font-size:0.76rem; color:var(--cyan); margin-top:2px;">Companion Package Ready</p>
                    </div>
                    <a href="${currentApp.companion.url}" target="_blank" rel="noopener" class="btn-download" style="padding:10px 16px; font-size:0.84rem;">
                      ⬇ ${currentApp.companion.btnText}
                    </a>
                  </div>
                </div>
              </div>
            ` : ''}

            <p class="risk-note">
              ⚠️ <strong>User Risk Notice:</strong> By clicking Download, you acknowledge that you are downloading and installing this package strictly at your own risk.
            </p>
          </div>
        `;

        // Fetch 512x512 HD icon for main app
        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(currentApp.searchTerm)}&entity=software&limit=1`)
          .then(r => r.json())
          .then(d => {
            if (d.results && d.results[0] && d.results[0].artworkUrl512) {
              document.getElementById('main-icon').src = d.results[0].artworkUrl512;
            }
          }).catch(() => {});

        // Render "More Apps" at the bottom
        const otherApps = APPS.filter(a => a.id !== currentApp.id).slice(0, 8);
        const moreGrid = document.getElementById('moreGrid');
        moreGrid.innerHTML = otherApps.map(app => `
          <a href="app.html?id=${app.id}" class="glass mini-card">
            <img id="more-icon-${app.id}" class="mini-icon" src="https://www.google.com/s2/favicons?sz=128&domain=${app.domain}" alt="${app.name}">
            <div class="mini-meta">
              <h4>${app.name}</h4>
              <span>${app.version} &rarr;</span>
            </div>
          </a>
        `).join('');

        otherApps.forEach(app => {
          fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(app.searchTerm)}&entity=software&limit=1`)
            .then(r => r.json())
            .then(d => {
              if (d.results && d.results[0] && d.results[0].artworkUrl512) {
                const el = document.getElementById(`more-icon-${app.id}`);
                if (el) el.src = d.results[0].artworkUrl512;
              }
            }).catch(() => {});
        });
      });
  </script>
